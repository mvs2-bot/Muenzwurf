<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Münzwurf</title>
<meta name="description" content="Entscheidungshilfe: Münze mehrfach werfen, zwei oder mehr Optionen">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script>
  // Theme früh setzen (kein Aufblitzen)
  try { const t = localStorage.getItem('mw.theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
</script>
<style>
  :root {
    --bg: #f4f1ea; --bg2: #ffffff; --card: #ffffff; --text: #1c1917; --muted: #78716c;
    --line: #e7e2d8;
    --c0: #0d9488; --c1: #ea580c; --c2: #7c3aed; --c3: #db2777; --c4: #2563eb; --c5: #65a30d;
    --gold1: #fde68a; --gold2: #f59e0b; --gold3: #b45309; --shadow: 0 10px 30px rgba(28,25,23,.10);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a; --bg2: #111c33; --card: #16213b; --text: #f1f5f9; --muted: #94a3b8; --line: #263452;
      --c0: #2dd4bf; --c1: #fb923c; --c2: #a78bfa; --c3: #f472b6; --c4: #60a5fa; --c5: #a3e635;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --bg2: #111c33; --card: #16213b; --text: #f1f5f9; --muted: #94a3b8; --line: #263452;
    --c0: #2dd4bf; --c1: #fb923c; --c2: #a78bfa; --c3: #f472b6; --c4: #60a5fa; --c5: #a3e635;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; min-height: 100dvh;
  }
  button, input { font: inherit; color: inherit; }

  /* Sticky Header */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; letter-spacing: .2px; }
  .brand img { width: 30px; height: 30px; }
  .icon-btn {
    border: 1.5px solid var(--line); background: var(--card); border-radius: 12px;
    padding: 7px 10px; font-size: 1.2rem; line-height: 1; cursor: pointer;
  }

  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  label.lbl, .lbl { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }

  /* Optionen */
  .opt-head { display: flex; justify-content: space-between; align-items: center; }
  .opt-list { display: grid; gap: 8px; }
  .opt-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; }
  .letter {
    width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: .9rem;
  }
  .opt-row input {
    width: 100%; padding: 11px 12px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--bg2); font-weight: 700; font-size: 1.02rem; outline: none; min-width: 0;
  }
  .rm { border: 0; background: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .rm:disabled { visibility: hidden; }
  .opt-tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .small-btn {
    border: 1.5px dashed var(--line); background: none; border-radius: 12px; padding: 8px 12px;
    font-weight: 700; font-size: .9rem; cursor: pointer; color: var(--muted);
  }
  .small-btn:disabled { opacity: .4; cursor: default; }

  .count { margin-top: 18px; }
  .count-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip {
    border: 1.5px solid var(--line); background: var(--bg2); border-radius: 999px;
    padding: 7px 14px; font-weight: 700; cursor: pointer;
  }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .count-row input {
    width: 84px; padding: 7px 10px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--bg2); font-weight: 700; text-align: center;
  }
  .hint { font-size: .82rem; color: var(--muted); margin-top: 8px; min-height: 1.2em; }

  .go {
    margin-top: 16px; width: 100%; border: 0; border-radius: 16px; padding: 18px;
    font-size: 1.25rem; font-weight: 800; cursor: pointer; color: #451a03;
    background: linear-gradient(135deg, var(--gold1), var(--gold2));
    box-shadow: 0 8px 22px rgba(245,158,11,.35), inset 0 -3px 0 rgba(0,0,0,.12);
    transition: transform .12s;
  }
  .go:active { transform: scale(.98); }

  /* Verlauf */
  section.history { margin-top: 22px; }
  .hist-head { display: flex; justify-content: space-between; align-items: center; margin: 0 4px 10px; }
  .hist-head h2 { font-size: 1.05rem; margin: 0; }
  .link-btn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .85rem; text-decoration: underline; }
  .hist-list { display: grid; gap: 8px; }
  .hist-item {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px;
    cursor: pointer; text-align: left; width: 100%;
  }
  .hist-win { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-score { font-weight: 800; font-variant-numeric: tabular-nums; }
  .hist-meta { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .minibar { grid-column: 1 / -1; height: 5px; border-radius: 4px; overflow: hidden; display: flex; background: var(--line); }
  .empty { color: var(--muted); text-align: center; padding: 18px; border: 1.5px dashed var(--line); border-radius: 14px; }
  footer { text-align: center; color: var(--muted); font-size: .75rem; padding: 0 16px 30px; }

  /* Pop-Over (Dialog) */
  dialog {
    border: 0; padding: 0; background: transparent; color: var(--text);
    max-width: min(440px, calc(100vw - 28px)); width: 100%; max-height: calc(100dvh - 40px); overflow: visible;
  }
  dialog::backdrop { background: rgba(2,6,23,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  dialog[open] .pop { animation: popIn .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes popIn { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pop {
    background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
    padding: 24px 20px 20px; text-align: center; position: relative; overflow: hidden;
    max-height: calc(100dvh - 40px); display: flex; flex-direction: column;
  }

  /* Münze */
  .stage { height: 230px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; perspective: 900px; position: relative; }
  .coin {
    width: 150px; height: 150px; position: relative; transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.2,1.2,.4,1);
  }
  .coin.spinning { animation: toss .9s cubic-bezier(.45,.05,.55,.95) infinite; transition: none; }
  @keyframes toss {
    0%   { transform: translateY(0)      rotateX(0deg); }
    50%  { transform: translateY(-70px)  rotateX(900deg); }
    100% { transform: translateY(0)      rotateX(1800deg); }
  }
  .face {
    position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; padding: 22px; text-align: center;
    font-weight: 900; font-size: 1.05rem; line-height: 1.15; color: #451a03; word-break: break-word;
    background: radial-gradient(circle at 35% 30%, #fff7d6 0%, var(--gold1) 25%, var(--gold2) 70%, var(--gold3) 100%);
    box-shadow: inset 0 0 0 7px rgba(180,83,9,.55), inset 0 0 0 11px rgba(255,247,214,.6), 0 0 0 2px rgba(120,53,15,.35);
  }
  .face .tag {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    font-size: .7rem; font-weight: 900; letter-spacing: 1px; padding: 2px 8px; border-radius: 99px; color: #fff;
  }
  .face.back { transform: rotateX(180deg); }
  .shadow { width: 120px; height: 16px; margin-top: 18px; border-radius: 50%; background: rgba(0,0,0,.28); filter: blur(4px); }
  .spinning + .shadow { animation: shadow .9s cubic-bezier(.45,.05,.55,.95) infinite; }
  @keyframes shadow { 50% { transform: scale(.55); opacity: .45; } }

  .throw-title { font-weight: 800; font-size: 1.15rem; margin: 14px 0 4px; }
  .live { display: grid; gap: 6px 10px; margin: 6px 0 4px; }
  .live-cell { min-width: 0; }
  .live-cell b { display: block; font-size: 2rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .live.many .live-cell b { font-size: 1.5rem; }
  .live-cell span { display: block; font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress { height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 14px; }
  .progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold1), var(--gold2)); }
  .progress-txt { font-size: .8rem; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* Ergebnis */
  .res-label { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .res-win { font-size: 2rem; font-weight: 900; margin: 6px 0 2px; line-height: 1.15; word-break: break-word; }
  .res-sub { color: var(--muted); font-size: .92rem; }
  .bars { margin: 18px 0 6px; display: grid; gap: 10px; text-align: left; flex-shrink: 0; }
  .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-weight: 700; font-size: .92rem; }
  .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .num { font-variant-numeric: tabular-nums; }
  .bar { grid-column: 1 / -1; height: 12px; border-radius: 8px; background: var(--line); overflow: hidden; }
  .bar div { height: 100%; width: 0; border-radius: 8px; transition: width .9s cubic-bezier(.2,1,.3,1); }
  .throws-head { text-align: left; font-size: .8rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 14px 0 8px; }
  .throws { display: flex; flex-wrap: wrap; gap: 6px; overflow-y: auto; min-height: 40px; padding: 2px; }
  .t {
    width: 38px; height: 38px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; font-size: .85rem; line-height: 1; color: #fff; opacity: 0; animation: tIn .3s forwards;
  }
  .t small { font-size: .55rem; font-weight: 700; opacity: .85; margin-bottom: 1px; }
  @keyframes tIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; flex-shrink: 0; }
  .btn { border-radius: 14px; padding: 13px; font-weight: 800; cursor: pointer; border: 1.5px solid var(--line); background: var(--bg2); }
  .btn.primary { border: 0; color: #451a03; background: linear-gradient(135deg, var(--gold1), var(--gold2)); }

  .confetti { position: absolute; left: 50%; top: 70px; pointer-events: none; }
  .confetti i {
    position: absolute; width: 8px; height: 12px; border-radius: 2px; opacity: 0;
    animation: burst 1.3s cubic-bezier(.15,.8,.3,1) forwards;
  }
  @keyframes burst {
    0% { opacity: 1; transform: translate(0,0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .coin.spinning { animation-duration: 2.4s; }
    .confetti { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><img src="icon.svg" alt=""> Münzwurf</div>
  <button class="icon-btn" id="themeBtn" aria-label="Hell/Dunkel umschalten">🌙</button>
</header>

<main>
  <div class="card">
    <div class="opt-head">
      <span class="lbl">Optionen</span>
    </div>
    <div class="opt-list" id="optList"></div>
    <div class="opt-tools">
      <button class="small-btn" id="addBtn">＋ Option hinzufügen</button>
      <button class="small-btn" id="swapBtn" title="Reihenfolge tauschen">⇅ Tauschen</button>
    </div>

    <div class="count">
      <label class="lbl" for="countInput">Anzahl Würfe</label>
      <div class="count-row" id="countRow">
        <button class="chip" data-n="1">1</button>
        <button class="chip" data-n="3">3</button>
        <button class="chip" data-n="11">11</button>
        <button class="chip" data-n="21">21</button>
        <button class="chip" data-n="51">51</button>
        <input id="countInput" type="number" min="1" max="999" inputmode="numeric" aria-label="Eigene Anzahl">
      </div>
      <div class="hint" id="countHint"></div>
    </div>

    <button class="go" id="goBtn">🪙 Münze werfen</button>
  </div>

  <section class="history">
    <div class="hist-head">
      <h2>Letzte Ergebnisse</h2>
      <button class="link-btn" id="clearBtn">Verlauf löschen</button>
    </div>
    <div class="hist-list" id="histList"></div>
  </section>
</main>

<footer>Zufall per <code>crypto.getRandomValues</code> · gespeichert nur auf diesem Gerät</footer>

<!-- Pop-Over: Wurf läuft -->
<dialog id="throwDlg">
  <div class="pop">
    <div class="stage">
      <div class="coin" id="coin">
        <div class="face front"><span class="tag" id="tagF"></span><span id="faceF"></span></div>
        <div class="face back"><span class="tag" id="tagB"></span><span id="faceB"></span></div>
      </div>
      <div class="shadow"></div>
    </div>
    <div class="throw-title" id="throwTitle">Die Münze fliegt …</div>
    <div class="live" id="live"></div>
    <div class="progress"><div id="progBar"></div></div>
    <div class="progress-txt" id="progTxt"></div>
  </div>
</dialog>

<!-- Pop-Over: Ergebnis -->
<dialog id="resDlg">
  <div class="pop">
    <div class="confetti" id="confetti"></div>
    <div class="res-label" id="resLabel">Ergebnis</div>
    <div class="res-win" id="resWin"></div>
    <div class="res-sub" id="resSub"></div>
    <div class="bars" id="bars"></div>
    <div class="throws-head">Einzelne Würfe</div>
    <div class="throws" id="throws"></div>
    <div class="actions">
      <button class="btn" id="closeBtn">Schließen</button>
      <button class="btn primary" id="againBtn">Nochmal werfen</button>
    </div>
  </div>
</dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const HIST_MAX = 50, N_MAX = 999, OPT_MAX = 6;
  const LETTERS = 'ABCDEF';
  const col = i => `var(--c${i})`;
  const defName = i => 'Option ' + LETTERS[i];

  /* ---------- Echter Zufall (kryptografisch, ohne Verzerrung) ---------- */
  function randomInt(maxExclusive) {
    const buf = new Uint32Array(1), limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % maxExclusive;
  }
  const randomPicks = (n, k) => Array.from({ length: n }, () => randomInt(k));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- Hilfsfunktionen Ergebnis ---------- */
  function tally(picks, k) { const c = Array(k).fill(0); picks.forEach(p => c[p]++); return c; }
  function leaders(counts) { const m = Math.max(...counts); return counts.map((c, i) => c === m ? i : -1).filter(i => i >= 0); }

  // Alte Einträge (nur A/B) ins neue Format bringen
  function normEntry(e) {
    if (e.opts) return e;
    return { ts: e.ts, opts: [e.a, e.b], n: e.n, counts: [e.ca, e.cb], t: (e.t || '').replace(/A/g, '0').replace(/B/g, '1') };
  }

  /* ---------- Einstellungen (vorausgefüllt) ---------- */
  let saved = LS.get('mw.settings', {});
  let opts = Array.isArray(saved.opts) ? saved.opts : [saved.a || defName(0), saved.b || defName(1)];
  let nSaved = saved.n || 21;

  // optional per URL: ?o=Gym,Bouldern,Laufen&n=21  oder  ?a=Gym&b=Bouldern
  const qp = new URLSearchParams(location.search);
  if (qp.get('o')) opts = qp.get('o').split(',').map(x => x.trim().slice(0, 40)).filter(Boolean);
  else if (qp.get('a') || qp.get('b')) opts = [(qp.get('a') || defName(0)).slice(0, 40), (qp.get('b') || defName(1)).slice(0, 40)];
  if (qp.get('n')) nSaved = parseInt(qp.get('n'), 10) || nSaved;
  opts = opts.slice(0, OPT_MAX);
  while (opts.length < 2) opts.push(defName(opts.length));

  const optList = $('#optList'), countInput = $('#countInput');

  function renderOptions(focusIdx) {
    optList.innerHTML = '';
    opts.forEach((name, i) => {
      const row = document.createElement('div'); row.className = 'opt-row';
      const l = document.createElement('div'); l.className = 'letter'; l.textContent = LETTERS[i]; l.style.background = col(i);
      const inp = document.createElement('input');
      inp.type = 'text'; inp.maxLength = 40; inp.autocomplete = 'off'; inp.placeholder = defName(i); inp.value = name;
      inp.style.borderColor = `color-mix(in srgb, ${col(i)} 55%, var(--line))`;
      inp.setAttribute('aria-label', 'Option ' + LETTERS[i]);
      inp.addEventListener('input', () => { opts[i] = inp.value; save(); });
      inp.addEventListener('focus', () => inp.select());
      const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '✕';
      rm.setAttribute('aria-label', 'Option ' + LETTERS[i] + ' entfernen');
      rm.disabled = opts.length <= 2;
      rm.addEventListener('click', () => { opts.splice(i, 1); renderOptions(); save(); });
      row.append(l, inp, rm); optList.appendChild(row);
      if (focusIdx === i) setTimeout(() => inp.focus(), 0);
    });
    $('#addBtn').disabled = opts.length >= OPT_MAX;
    $('#swapBtn').style.display = opts.length === 2 ? '' : 'none';
    $('#goBtn').textContent = opts.length === 2 ? '🪙 Münze werfen' : `🪙 Werfen (${opts.length} Optionen)`;
    updateHint();
  }

  $('#addBtn').addEventListener('click', () => {
    if (opts.length >= OPT_MAX) return;
    opts.push(''); renderOptions(opts.length - 1); save();
  });
  $('#swapBtn').addEventListener('click', () => { opts.reverse(); renderOptions(); save(); });

  function names() { return opts.map((o, i) => (o || '').trim() || defName(i)); }
  function clampN(v) { v = parseInt(v, 10); return isNaN(v) ? 21 : Math.min(N_MAX, Math.max(1, v)); }
  function updateHint() {
    const n = clampN(countInput.value), k = opts.length;
    $('#countHint').textContent =
      k > 2 ? 'Jeder Wurf wählt zufällig eine der Optionen – ein Gleichstand ist möglich.'
      : n % 2 === 0 ? 'Gerade Anzahl – ein Unentschieden ist möglich.' : '';
  }
  function setCount(n) {
    n = clampN(n); countInput.value = n;
    document.querySelectorAll('#countRow .chip').forEach(c => c.classList.toggle('active', +c.dataset.n === n));
    updateHint(); save();
  }
  function save() { LS.set('mw.settings', { opts: opts.map(o => (o || '').trim()), n: clampN(countInput.value) }); }

  document.querySelectorAll('#countRow .chip').forEach(c => c.addEventListener('click', () => setCount(c.dataset.n)));
  countInput.addEventListener('change', () => setCount(countInput.value));
  countInput.addEventListener('input', () => {
    const n = parseInt(countInput.value, 10);
    document.querySelectorAll('#countRow .chip').forEach(c => c.classList.toggle('active', +c.dataset.n === n));
  });

  countInput.value = clampN(nSaved);
  renderOptions();
  setCount(nSaved);

  /* ---------- Hell / Dunkel ---------- */
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => (document.documentElement.dataset.theme || (mq.matches ? 'dark' : 'light')) === 'dark';
  function themeIcon() {
    $('#themeBtn').textContent = isDark() ? '☀️' : '🌙';
    document.querySelector('meta[name=theme-color]').content = isDark() ? '#0f172a' : '#f4f1ea';
  }
  $('#themeBtn').addEventListener('click', () => {
    const t = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = t; LS.set('mw.theme', t); themeIcon();
  });
  mq.addEventListener?.('change', themeIcon);
  themeIcon();

  /* ---------- Wurf ---------- */
  const throwDlg = $('#throwDlg'), resDlg = $('#resDlg'), coin = $('#coin');
  throwDlg.addEventListener('cancel', e => e.preventDefault()); // während des Wurfs nicht abbrechbar
  let busy = false;

  function setFace(side, idx, text) {
    const tag = $(side === 'F' ? '#tagF' : '#tagB');
    $(side === 'F' ? '#faceF' : '#faceB').textContent = text;
    tag.textContent = idx >= 0 ? LETTERS[idx] : '=';
    tag.style.background = idx >= 0 ? col(idx) : 'var(--muted)';
  }

  async function doThrow() {
    if (busy) return; busy = true;
    if (resDlg.open) resDlg.close();
    const nm = names(), k = nm.length, n = clampN(countInput.value);
    setCount(n);

    const picks = randomPicks(n, k);
    const delay = 3000 + randomInt(2001); // zufällig 3,000–5,000 s
    const counts = tally(picks, k), lead = leaders(counts);
    const winner = lead.length === 1 ? lead[0] : -1;

    // Pop-Over vorbereiten
    setFace('F', 0, nm[0]); setFace('B', 1, nm[1]);
    const live = $('#live'); live.innerHTML = '';
    live.className = 'live' + (k > 3 ? ' many' : '');
    live.style.gridTemplateColumns = `repeat(${k > 3 ? 3 : k}, 1fr)`;
    const liveNums = nm.map((name, i) => {
      const c = document.createElement('div'); c.className = 'live-cell';
      const b = document.createElement('b'); b.textContent = '0'; b.style.color = col(i);
      const s = document.createElement('span'); s.textContent = name;
      c.append(b, s); live.appendChild(c); return b;
    });
    $('#progBar').style.width = '0%'; $('#progTxt').textContent = `Wurf 0 von ${n}`;
    $('#throwTitle').textContent = 'Die Münze fliegt …';
    coin.style.transform = ''; coin.classList.add('spinning');
    throwDlg.showModal();

    // Bei mehr als zwei Optionen wechseln die Münzseiten im Flug
    let faceTimer = null;
    if (k > 2) faceTimer = setInterval(() => {
      const f = randomInt(k), b = randomInt(k);
      setFace('F', f, nm[f]); setFace('B', b, nm[b]);
    }, 220);

    // Würfe live mitzählen
    const start = performance.now(), run = Array(k).fill(0);
    let shown = 0, raf;
    const tick = now => {
      const target = Math.min(n, Math.floor(((now - start) / delay) * n));
      while (shown < target) run[picks[shown++]]++;
      run.forEach((v, i) => liveNums[i].textContent = v);
      $('#progBar').style.width = (shown / n * 100) + '%';
      $('#progTxt').textContent = `Wurf ${shown} von ${n}`;
      if (shown < n) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    await sleep(delay);
    cancelAnimationFrame(raf); tick(start + delay);
    clearInterval(faceTimer);

    // Landen – auf der Gewinnerseite
    $('#throwTitle').textContent = winner >= 0 ? 'Gelandet!' : 'Gleichstand!';
    coin.classList.remove('spinning');
    if (k === 2 && winner === 1) {
      coin.style.transform = 'rotateX(1980deg)';
    } else {
      if (winner >= 0) setFace('F', winner, nm[winner]);
      else setFace('F', -1, lead.map(i => nm[i]).join(' = '));
      coin.style.transform = 'rotateX(1800deg)';
    }
    await sleep(800);
    throwDlg.close();

    const entry = { ts: Date.now(), opts: nm, n, counts, t: picks.join('') };
    const hist = LS.get('mw.history', []); hist.unshift(entry); LS.set('mw.history', hist.slice(0, HIST_MAX));
    renderHistory();
    showResult(entry, true);
    if (navigator.vibrate) navigator.vibrate(winner >= 0 ? [40, 60, 90] : [60, 60, 60]);
    busy = false;
  }

  /* ---------- Ergebnis-Pop-Over ---------- */
  function showResult(raw, celebrate) {
    const e = normEntry(raw), k = e.opts.length;
    const lead = leaders(e.counts), winner = lead.length === 1 ? lead[0] : -1;
    const pct = v => Math.round(v / e.n * 100);
    const score = e.counts.join(' : ');

    $('#resLabel').textContent = winner >= 0 ? 'Die Münze sagt' : 'Unentschieden';
    const win = $('#resWin');
    win.textContent = winner >= 0 ? e.opts[winner] : lead.map(i => e.opts[i]).join(' = ');
    win.style.color = winner >= 0 ? col(winner) : 'var(--text)';
    const wurf = e.n === 1 ? 'Wurf' : 'Würfen';
    $('#resSub').textContent = winner >= 0
      ? (k === 2 ? `${Math.max(...e.counts)} : ${Math.min(...e.counts)} bei ${e.n} ${wurf}` : `${e.counts[winner]} von ${e.n} ${wurf} · ${score}`)
      : `${score} – einfach nochmal werfen`;

    // Balken
    const bars = $('#bars'); bars.innerHTML = '';
    const fills = e.opts.map((name, i) => {
      const r = document.createElement('div'); r.className = 'bar-row';
      const nmEl = document.createElement('span'); nmEl.className = 'name'; nmEl.textContent = `${LETTERS[i]} · ${name}`;
      const num = document.createElement('span'); num.className = 'num'; num.textContent = `${e.counts[i]} (${pct(e.counts[i])} %)`;
      const bar = document.createElement('div'); bar.className = 'bar';
      const fill = document.createElement('div'); fill.style.background = col(i);
      bar.appendChild(fill); r.append(nmEl, num, bar); bars.appendChild(r);
      return fill;
    });

    // Einzelne Würfe
    const box = $('#throws'); box.innerHTML = '';
    const frag = document.createDocumentFragment();
    [...e.t].forEach((ch, i) => {
      const p = +ch, d = document.createElement('div');
      d.className = 't'; d.style.background = col(p);
      d.style.animationDelay = Math.min(i * 0.025, 1.2) + 's';
      d.title = `Wurf ${i + 1}: ${e.opts[p]}`;
      d.innerHTML = `<small>${i + 1}</small>${LETTERS[p]}`;
      frag.appendChild(d);
    });
    box.appendChild(frag);

    resDlg.showModal();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fills.forEach((f, i) => f.style.width = pct(e.counts[i]) + '%');
    }));
    if (celebrate && winner >= 0) confetti(winner);
  }

  function confetti(winner) {
    const c = $('#confetti'); c.innerHTML = '';
    const cs = getComputedStyle(document.documentElement);
    const colors = [cs.getPropertyValue('--c' + winner), '#fde68a', '#f59e0b', '#ffffff'];
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('i');
      const ang = (i / 28) * Math.PI * 2, dist = 90 + randomInt(90);
      p.style.setProperty('--x', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--y', Math.sin(ang) * dist * 0.8 + 'px');
      p.style.setProperty('--r', (randomInt(720) - 360) + 'deg');
      p.style.background = colors[i % colors.length];
      c.appendChild(p);
    }
  }

  $('#goBtn').addEventListener('click', doThrow);
  $('#againBtn').addEventListener('click', doThrow);
  $('#closeBtn').addEventListener('click', () => resDlg.close());
  resDlg.addEventListener('click', e => { if (e.target === resDlg) resDlg.close(); });

  /* ---------- Verlauf ---------- */
  function renderHistory() {
    const list = $('#histList'), hist = LS.get('mw.history', []).map(normEntry);
    list.innerHTML = '';
    $('#clearBtn').style.display = hist.length ? '' : 'none';
    if (!hist.length) {
      const d = document.createElement('div'); d.className = 'empty';
      d.textContent = 'Noch keine Würfe – los geht’s!'; list.appendChild(d); return;
    }
    hist.forEach(e => {
      const lead = leaders(e.counts), winner = lead.length === 1 ? lead[0] : -1;
      const b = document.createElement('button'); b.className = 'hist-item';
      const w = document.createElement('div'); w.className = 'hist-win';
      w.textContent = winner >= 0 ? '🏆 ' + e.opts[winner] : '🤝 Unentschieden';
      if (winner >= 0) w.style.color = col(winner);
      const sc = document.createElement('div'); sc.className = 'hist-score'; sc.textContent = e.counts.join(' : ');
      const bar = document.createElement('div'); bar.className = 'minibar';
      e.counts.forEach((c, i) => {
        const s = document.createElement('span'); s.style.width = (c / e.n * 100) + '%'; s.style.background = col(i);
        bar.appendChild(s);
      });
      const m = document.createElement('div'); m.className = 'hist-meta';
      const dt = new Date(e.ts).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
      m.textContent = `${dt} · ${e.opts.join(' vs. ')} · ${e.n} ${e.n === 1 ? 'Wurf' : 'Würfe'}`;
      b.append(w, sc, bar, m);
      b.addEventListener('click', () => showResult(e, false));
      list.appendChild(b);
    });
  }
  $('#clearBtn').addEventListener('click', () => {
    if (confirm('Alle gespeicherten Ergebnisse löschen?')) { LS.set('mw.history', []); renderHistory(); }
  });
  renderHistory();

  /* ---------- Offline / installierbar ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>

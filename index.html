<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Münzwurf</title>
<meta name="description" content="Entscheidungshilfe: Münze mehrfach werfen, zwei oder mehr Optionen">
<meta name="theme-color" content="#f4f1ea">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script>
  // Theme früh setzen (kein Aufblitzen). Standard ist hell, dunkel nur nach eigener Wahl.
  try { if (JSON.parse(localStorage.getItem('mw.theme')) === 'dark') { document.documentElement.dataset.theme = 'dark'; document.querySelector('meta[name=theme-color]').content = '#000000'; } } catch (e) {}
</script>
<style>
  :root {
    --bg: #f4f1ea; --bg2: #ffffff; --card: #ffffff; --text: #1c1917; --muted: #78716c;
    --line: #e7e2d8;
    --c0: #0d9488; --c1: #ea580c; --c2: #7c3aed; --c3: #db2777; --c4: #2563eb; --c5: #65a30d;
    --gold1: #fde68a; --gold2: #f59e0b; --gold3: #b45309; --shadow: 0 10px 30px rgba(28,25,23,.10);
    --radius: 18px; --on-c: #ffffff;
  }
  /* Dunkelmodus, optimiert für AMOLED: reines Schwarz (Pixel aus), kaum Flächen, keine Schatten */
  :root[data-theme="dark"] {
    --bg: #000000; --bg2: #000000; --card: #0a0a0a; --text: #ededed; --muted: #a3a3a3; --line: #262626;
    --c0: #2dd4bf; --c1: #fb923c; --c2: #a78bfa; --c3: #f472b6; --c4: #60a5fa; --c5: #a3e635;
    --shadow: none; --on-c: #000000;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; min-height: 100dvh;
  }
  button, input { font: inherit; color: inherit; }

  /* Sticky Header */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; letter-spacing: .2px; }
  .brand img { width: 30px; height: 30px; }
  .icon-btn {
    border: 1.5px solid var(--line); background: var(--card); border-radius: 12px;
    padding: 7px 10px; font-size: 1.2rem; line-height: 1; cursor: pointer;
  }

  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  label.lbl, .lbl { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }

  /* Optionen */
  .opt-head { display: flex; justify-content: space-between; align-items: center; }
  .opt-list { display: grid; gap: 8px; }
  .opt-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; }
  .letter {
    width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: .9rem;
  }
  .opt-row input {
    width: 100%; padding: 11px 12px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--bg2); font-weight: 700; font-size: 1.02rem; outline: none; min-width: 0;
  }
  .rm { border: 0; background: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .rm:disabled { visibility: hidden; }
  .opt-tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .small-btn {
    border: 1.5px dashed var(--line); background: none; border-radius: 12px; padding: 8px 12px;
    font-weight: 700; font-size: .9rem; cursor: pointer; color: var(--muted);
  }
  .small-btn:disabled { opacity: .4; cursor: default; }

  .count { margin-top: 18px; }
  .count-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip {
    border: 1.5px solid var(--line); background: var(--bg2); border-radius: 999px;
    padding: 7px 14px; font-weight: 700; cursor: pointer;
  }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .count-row input {
    width: 84px; padding: 7px 10px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--bg2); font-weight: 700; text-align: center;
  }
  .hint { font-size: .82rem; color: var(--muted); margin-top: 8px; min-height: 1.2em; }

  .go {
    margin-top: 16px; width: 100%; border: 0; border-radius: 16px; padding: 18px;
    font-size: 1.25rem; font-weight: 800; cursor: pointer; color: #451a03;
    background: linear-gradient(135deg, var(--gold1), var(--gold2));
    box-shadow: 0 8px 22px rgba(245,158,11,.35), inset 0 -3px 0 rgba(0,0,0,.12);
    transition: transform .12s;
  }
  .go:active { transform: scale(.98); }

  /* Verlauf */
  section.history { margin-top: 22px; }
  .hist-head { display: flex; justify-content: space-between; align-items: center; margin: 0 4px 10px; }
  .hist-head h2 { font-size: 1.05rem; margin: 0; }
  .link-btn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .85rem; text-decoration: underline; }
  .hist-list { display: grid; gap: 8px; }
  .hist-item {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px;
    cursor: pointer; text-align: left; width: 100%;
  }
  .hist-win { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-score { font-weight: 800; font-variant-numeric: tabular-nums; }
  .hist-meta { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .minibar { grid-column: 1 / -1; height: 5px; border-radius: 4px; overflow: hidden; display: flex; background: var(--line); }
  .empty { color: var(--muted); text-align: center; padding: 18px; border: 1.5px dashed var(--line); border-radius: 14px; }
  footer { text-align: center; color: var(--muted); font-size: .75rem; padding: 0 16px 30px; }

  /* Pop-Over (Dialog) */
  dialog {
    border: 0; padding: 0; background: transparent; color: var(--text);
    max-width: min(440px, calc(100vw - 28px)); width: 100%; max-height: calc(100dvh - 40px); overflow: visible;
  }
  dialog::backdrop { background: rgba(2,6,23,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  :root[data-theme="dark"] dialog::backdrop { background: rgba(0,0,0,.8); }
  dialog[open] .pop { animation: popIn .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes popIn { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pop {
    background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
    padding: 24px 20px 20px; text-align: center; position: relative; overflow: hidden;
    max-height: calc(100dvh - 40px); display: flex; flex-direction: column;
  }

  /* Münze */
  .stage { height: 230px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; perspective: 900px; position: relative; }
  .coin {
    width: 150px; height: 150px; position: relative; transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.2,1.2,.4,1);
  }
  .coin.spinning { animation: toss .9s cubic-bezier(.45,.05,.55,.95) infinite; transition: none; }
  @keyframes toss {
    0%   { transform: translateY(0)      rotateX(0deg); }
    50%  { transform: translateY(-70px)  rotateX(900deg); }
    100% { transform: translateY(0)      rotateX(1800deg); }
  }
  .face {
    position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; padding: 22px; text-align: center;
    font-weight: 900; font-size: 1.05rem; line-height: 1.15; color: #451a03; word-break: break-word;
    background: radial-gradient(circle at 35% 30%, #fff7d6 0%, var(--gold1) 25%, var(--gold2) 70%, var(--gold3) 100%);
    box-shadow: inset 0 0 0 7px rgba(180,83,9,.55), inset 0 0 0 11px rgba(255,247,214,.6), 0 0 0 2px rgba(120,53,15,.35);
  }
  .face .tag {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    font-size: .7rem; font-weight: 900; letter-spacing: 1px; padding: 2px 8px; border-radius: 99px; color: #fff;
  }
  .face.back { transform: rotateX(180deg); }
  .shadow { width: 120px; height: 16px; margin-top: 18px; border-radius: 50%; background: rgba(0,0,0,.28); filter: blur(4px); }
  .spinning + .shadow { animation: shadow .9s cubic-bezier(.45,.05,.55,.95) infinite; }
  @keyframes shadow { 50% { transform: scale(.55); opacity: .45; } }

  .throw-title { font-weight: 800; font-size: 1.15rem; margin: 14px 0 4px; }
  .live { display: grid; gap: 6px 10px; margin: 6px 0 4px; }
  .live-cell { min-width: 0; }
  .live-cell b { display: block; font-size: 2rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .live.many .live-cell b { font-size: 1.5rem; }
  .live-cell span { display: block; font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress { height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 14px; }
  .progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold1), var(--gold2)); }
  .progress-txt { font-size: .8rem; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* Ergebnis */
  .res-label { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .res-win { font-size: 2rem; font-weight: 900; margin: 6px 0 2px; line-height: 1.15; word-break: break-word; }
  .res-sub { color: var(--muted); font-size: .92rem; }
  .bars { margin: 18px 0 6px; display: grid; gap: 10px; text-align: left; flex-shrink: 0; }
  .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-weight: 700; font-size: .92rem; }
  .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .num { font-variant-numeric: tabular-nums; }
  .bar { grid-column: 1 / -1; height: 12px; border-radius: 8px; background: var(--line); overflow: hidden; }
  .bar div { height: 100%; width: 0; border-radius: 8px; transition: width .9s cubic-bezier(.2,1,.3,1); }
  .throws-head { text-align: left; font-size: .8rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 14px 0 8px; }
  .throws { display: flex; flex-wrap: wrap; gap: 6px; overflow-y: auto; min-height: 40px; padding: 2px; }
  .t {
    width: 38px; height: 38px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; font-size: .85rem; line-height: 1; color: #fff; opacity: 0; animation: tIn .3s forwards;
  }
  .t small { font-size: .55rem; font-weight: 700; opacity: .85; margin-bottom: 1px; }
  @keyframes tIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; flex-shrink: 0; }
  .btn { border-radius: 14px; padding: 13px; font-weight: 800; cursor: pointer; border: 1.5px solid var(--line); background: var(--bg2); }
  .btn.primary { border: 0; color: #451a03; background: linear-gradient(135deg, var(--gold1), var(--gold2)); }

  .confetti { position: absolute; left: 50%; top: 70px; pointer-events: none; }
  .confetti i {
    position: absolute; width: 8px; height: 12px; border-radius: 2px; opacity: 0;
    animation: burst 1.3s cubic-bezier(.15,.8,.3,1) forwards;
  }
  @keyframes burst {
    0% { opacity: 1; transform: translate(0,0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); }
  }

  /* ---------- Weitere Werkzeuge ---------- */
  .brand a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  #backBtn { text-decoration: none; color: inherit; font-weight: 800; padding: 7px 12px; }
  .view[hidden], #backBtn[hidden] { display: none; }

  section.tools { margin-top: 22px; }
  .tool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    color: inherit; text-decoration: none; font-weight: 800; font-size: .82rem; text-align: center;
    transition: transform .12s;
  }
  .tool:active { transform: scale(.96); }
  .tool .tool-ico { font-size: 1.6rem; line-height: 1; }

  .sec-gap { margin-top: 18px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .letter.num { font-size: .85rem; }
  .opt-row.hot input { background: linear-gradient(135deg, var(--gold1), var(--gold2)); color: #451a03; border-color: var(--gold3) !important; }
  .opt-row.hot .letter { transform: scale(1.15); }
  .opt-row .letter { transition: transform .1s; }
  textarea {
    width: 100%; padding: 11px 12px; border-radius: 12px; border: 2px solid var(--line); resize: vertical;
    background: var(--bg2); font: inherit; font-weight: 700; color: inherit; outline: none; line-height: 1.45;
  }
  .lbl .cnt { text-transform: none; letter-spacing: 0; font-weight: 600; }

  /* Würfel */
  .dice-stage { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; min-height: 92px; align-items: center; margin-top: 20px; }
  .die {
    width: 68px; height: 68px; border-radius: 16px; position: relative;
    background: var(--bg2); border: 2.5px solid var(--line); box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.7rem;
    font-variant-numeric: tabular-nums;
  }
  .die.pips { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 9px; }
  .die.pips i { width: 12px; height: 12px; border-radius: 50%; align-self: center; justify-self: center; }
  .die.pips i.on { background: var(--text); }
  .die small { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font-size: .55rem; font-weight: 800; color: var(--muted); }
  .die.rolling { animation: shake .28s infinite; }
  .die.landed { animation: tIn .3s; }
  @keyframes shake {
    0%, 100% { transform: rotate(0) translate(0, 0); }
    25% { transform: rotate(-12deg) translate(-3px, -4px); }
    75% { transform: rotate(10deg) translate(3px, -2px); }
  }
  .dice-sum { text-align: center; margin-top: 14px; min-height: 2.6em; }
  .dice-sum b { display: block; font-size: 2.2rem; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .dice-sum span { color: var(--muted); font-size: .9rem; }
  .mini-hist { display: grid; gap: 6px; }
  .mini-item {
    display: flex; justify-content: space-between; gap: 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 14px; font-size: .9rem; font-variant-numeric: tabular-nums;
  }
  .mini-item span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Glücksrad */
  .wheel-wrap { position: relative; width: min(100%, 320px); aspect-ratio: 1; margin: 6px auto 0; }
  #wheel { width: 100%; height: 100%; display: block; transform: rotate(0deg); filter: drop-shadow(0 8px 18px rgba(0,0,0,.18)); }
  #wheel text { fill: var(--on-c); font-weight: 800; dominant-baseline: central; pointer-events: none; }
  .wheel-pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%); z-index: 2;
    width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
    border-top: 28px solid var(--text); filter: drop-shadow(0 2px 2px rgba(0,0,0,.3));
  }
  .wheel-hub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22%; aspect-ratio: 1;
    border-radius: 50%; border: 0; cursor: pointer; font-size: 1.5rem;
    background: radial-gradient(circle at 35% 30%, #fff7d6 0%, var(--gold1) 30%, var(--gold2) 80%, var(--gold3) 100%);
    box-shadow: 0 3px 10px rgba(0,0,0,.3), inset 0 0 0 4px rgba(180,83,9,.45);
  }

  /* Teams */
  .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 18px; }
  .team { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .team h3 { margin: 0; padding: 8px 12px; color: #fff; font-size: .95rem; }
  .team ol { margin: 0; padding: 8px 12px 10px 32px; font-weight: 700; }
  .team li { padding: 2px 0; overflow-wrap: anywhere; }
  .team-actions { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
  .team-actions .btn { padding: 10px 16px; }

  /* Ergebnis-Pop-Over der Werkzeuge */
  .res-emoji { font-size: 3.2rem; line-height: 1; margin-bottom: 8px; }
  .res-extra { grid-column: 1 / -1; }

  @media (prefers-reduced-motion: reduce) {
    .coin.spinning { animation-duration: 2.4s; }
    .confetti { display: none; }
    .die.rolling { animation: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <a class="icon-btn" id="backBtn" href="./" aria-label="Zurück zum Münzwurf" hidden>‹</a>
    <img src="icon.svg" alt="" id="brandIcon"> <span id="brandTitle">Münzwurf</span>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Hell/Dunkel umschalten">🌙</button>
</header>

<main class="view" id="view-coin">
  <div class="card">
    <div class="opt-head">
      <span class="lbl">Optionen</span>
    </div>
    <div class="opt-list" id="optList"></div>
    <div class="opt-tools">
      <button class="small-btn" id="addBtn">＋ Option hinzufügen</button>
      <button class="small-btn" id="swapBtn" title="Reihenfolge tauschen">⇅ Tauschen</button>
    </div>

    <div class="count">
      <label class="lbl" for="countInput">Anzahl Würfe</label>
      <div class="count-row" id="countRow">
        <button class="chip" data-n="1">1</button>
        <button class="chip" data-n="3">3</button>
        <button class="chip" data-n="11">11</button>
        <button class="chip" data-n="21">21</button>
        <button class="chip" data-n="51">51</button>
        <input id="countInput" type="number" min="1" max="999" inputmode="numeric" aria-label="Eigene Anzahl">
      </div>
      <div class="hint" id="countHint"></div>
    </div>

    <button class="go" id="goBtn">🪙 Münze werfen</button>
  </div>

  <section class="tools">
    <div class="hist-head"><h2>Weitere Entscheidungshelfer</h2></div>
    <nav class="tool-grid">
      <a class="tool" href="#wuerfel"><span class="tool-ico">🎲</span>Würfel</a>
      <a class="tool" href="#rad"><span class="tool-ico">🎡</span>Glücksrad</a>
      <a class="tool" href="#zahlt"><span class="tool-ico">💸</span>Wer zahlt?</a>
      <a class="tool" href="#teams"><span class="tool-ico">👥</span>Teams</a>
    </nav>
  </section>

  <section class="history">
    <div class="hist-head">
      <h2>Letzte Ergebnisse</h2>
      <button class="link-btn" id="clearBtn">Verlauf löschen</button>
    </div>
    <div class="hist-list" id="histList"></div>
  </section>
</main>

<!-- Würfel -->
<main class="view" id="view-wuerfel" hidden>
  <div class="card">
    <span class="lbl">Anzahl Würfel</span>
    <div class="chip-row" id="diceCount"></div>
    <span class="lbl sec-gap">Würfelart</span>
    <div class="chip-row" id="diceSides"></div>
    <div class="dice-stage" id="diceStage"></div>
    <div class="dice-sum" id="diceSum"></div>
    <button class="go" id="diceGo">🎲 Würfeln</button>
  </div>
  <section class="history">
    <div class="hist-head">
      <h2>Letzte Würfe</h2>
      <button class="link-btn" id="diceClear">Löschen</button>
    </div>
    <div class="mini-hist" id="diceHist"></div>
  </section>
</main>

<!-- Glücksrad -->
<main class="view" id="view-rad" hidden>
  <div class="card">
    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <svg id="wheel" viewBox="-100 -100 200 200" role="img" aria-label="Glücksrad"></svg>
      <button class="wheel-hub" id="wheelHub" aria-label="Rad drehen">🎡</button>
    </div>
    <button class="go" id="wheelGo">🎡 Rad drehen</button>
  </div>
  <div class="card sec-gap">
    <span class="lbl">Felder</span>
    <div class="opt-list" id="wheelList"></div>
    <div class="opt-tools"><button class="small-btn" id="wheelAdd">＋ Feld hinzufügen</button></div>
  </div>
</main>

<!-- Wer zahlt? -->
<main class="view" id="view-zahlt" hidden>
  <div class="card">
    <span class="lbl">Wer ist dabei?</span>
    <div class="opt-list" id="payList"></div>
    <div class="opt-tools"><button class="small-btn" id="payAdd">＋ Person hinzufügen</button></div>
    <button class="go" id="payGo">💸 Wer zahlt?</button>
  </div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const HIST_MAX = 50, N_MAX = 999, OPT_MAX = 6;
  const LETTERS = 'ABCDEF';
  const col = i => `var(--c${i % 6})`;
  const defName = i => 'Option ' + LETTERS[i];

  /* ---------- Echter Zufall (kryptografisch, ohne Verzerrung) ---------- */
  function randomInt(maxExclusive) {
    const buf = new Uint32Array(1), limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % maxExclusive;
  }
  const randomPicks = (n, k) => Array.from({ length: n }, () => randomInt(k));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- Hilfsfunktionen Ergebnis ---------- */
  function tally(picks, k) { const c = Array(k).fill(0); picks.forEach(p => c[p]++); return c; }
  function leaders(counts) { const m = Math.max(...counts); return counts.map((c, i) => c === m ? i : -1).filter(i => i >= 0); }

  // Alte Einträge (nur A/B) ins neue Format bringen
  function normEntry(e) {
    if (e.opts) return e;
    return { ts: e.ts, opts: [e.a, e.b], n: e.n, counts: [e.ca, e.cb], t: (e.t || '').replace(/A/g, '0').replace(/B/g, '1') };
  }

  /* ---------- Einstellungen (vorausgefüllt) ---------- */
  let saved = LS.get('mw.settings', {});
  let opts = Array.isArray(saved.opts) ? saved.opts : [saved.a || defName(0), saved.b || defName(1)];
  let nSaved = saved.n || 21;

  // optional per URL: ?o=Gym,Bouldern,Laufen&n=21  oder  ?a=Gym&b=Bouldern
  const qp = new URLSearchParams(location.search);
  if (qp.get('o')) opts = qp.get('o').split(',').map(x => x.trim().slice(0, 40)).filter(Boolean);
  else if (qp.get('a') || qp.get('b')) opts = [(qp.get('a') || defName(0)).slice(0, 40), (qp.get('b') || defName(1)).slice(0, 40)];
  if (qp.get('n')) nSaved = parseInt(qp.get('n'), 10) || nSaved;
  opts = opts.slice(0, OPT_MAX);
  while (opts.length < 2) opts.push(defName(opts.length));

  const optList = $('#optList'), countInput = $('#countInput');

  function renderOptions(focusIdx) {
    optList.innerHTML = '';
    opts.forEach((name, i) => {
      const row = document.createElement('div'); row.className = 'opt-row';
      const l = document.createElement('div'); l.className = 'letter'; l.textContent = LETTERS[i]; l.style.background = col(i);
      const inp = document.createElement('input');
      inp.type = 'text'; inp.maxLength = 40; inp.autocomplete = 'off'; inp.placeholder = defName(i); inp.value = name;
      inp.style.borderColor = `color-mix(in srgb, ${col(i)} 55%, var(--line))`;
      inp.setAttribute('aria-label', 'Option ' + LETTERS[i]);
      inp.addEventListener('input', () => { opts[i] = inp.value; save(); });
      inp.addEventListener('focus', () => inp.select());
      const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '✕';
      rm.setAttribute('aria-label', 'Option ' + LETTERS[i] + ' entfernen');
      rm.disabled = opts.length <= 2;
      rm.addEventListener('click', () => { opts.splice(i, 1); renderOptions(); save(); });
      row.append(l, inp, rm); optList.appendChild(row);
      if (focusIdx === i) setTimeout(() => inp.focus(), 0);
    });
    $('#addBtn').disabled = opts.length >= OPT_MAX;
    $('#swapBtn').style.display = opts.length === 2 ? '' : 'none';
    $('#goBtn').textContent = opts.length === 2 ? '🪙 Münze werfen' : `🪙 Werfen (${opts.length} Optionen)`;
    updateHint();
  }

  $('#addBtn').addEventListener('click', () => {
    if (opts.length >= OPT_MAX) return;
    opts.push(''); renderOptions(opts.length - 1); save();
  });
  $('#swapBtn').addEventListener('click', () => { opts.reverse(); renderOptions(); save(); });

  function names() { return opts.map((o, i) => (o || '').trim() || defName(i)); }
  function clampN(v) { v = parseInt(v, 10); return isNaN(v) ? 21 : Math.min(N_MAX, Math.max(1, v)); }
  function updateHint() {
    const n = clampN(countInput.value), k = opts.length;
    $('#countHint').textContent =
      k > 2 ? 'Jeder Wurf wählt zufällig eine der Optionen – ein Gleichstand ist möglich.'
      : n % 2 === 0 ? 'Gerade Anzahl – ein Unentschieden ist möglich.' : '';
  }
  function setCount(n) {
    n = clampN(n); countInput.value = n;
    document.querySelectorAll('#countRow .chip').forEach(c => c.classList.toggle('active', +c.dataset.n === n));
    updateHint(); save();
  }
  function save() { LS.set('mw.settings', { opts: opts.map(o => (o || '').trim()), n: clampN(countInput.value) }); }

  document.querySelectorAll('#countRow .chip').forEach(c => c.addEventListener('click', () => setCount(c.dataset.n)));
  countInput.addEventListener('change', () => setCount(countInput.value));
  countInput.addEventListener('input', () => {
    const n = parseInt(countInput.value, 10);
    document.querySelectorAll('#countRow .chip').forEach(c => c.classList.toggle('active', +c.dataset.n === n));
  });

  countInput.value = clampN(nSaved);
  renderOptions();
  setCount(nSaved);

  /* ---------- Hell / Dunkel ---------- */
  const isDark = () => document.documentElement.dataset.theme === 'dark';
  function themeIcon() {
    $('#themeBtn').textContent = isDark() ? '☀️' : '🌙';
    document.querySelector('meta[name=theme-color]').content = isDark() ? '#000000' : '#f4f1ea';
  }
  $('#themeBtn').addEventListener('click', () => {
    const t = isDark() ? 'light' : 'dark';
    if (t === 'dark') document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
    LS.set('mw.theme', t); themeIcon();
  });
  themeIcon();

  /* ---------- Wurf ---------- */
  const throwDlg = $('#throwDlg'), resDlg = $('#resDlg'), coin = $('#coin');
  throwDlg.addEventListener('cancel', e => e.preventDefault()); // während des Wurfs nicht abbrechbar
  let busy = false;

  function setFace(side, idx, text) {
    const tag = $(side === 'F' ? '#tagF' : '#tagB');
    $(side === 'F' ? '#faceF' : '#faceB').textContent = text;
    tag.textContent = idx >= 0 ? LETTERS[idx] : '=';
    tag.style.background = idx >= 0 ? col(idx) : 'var(--muted)';
  }

  async function doThrow() {
    if (busy) return; busy = true;
    if (resDlg.open) resDlg.close();
    const nm = names(), k = nm.length, n = clampN(countInput.value);
    setCount(n);

    const picks = randomPicks(n, k);
    const delay = 3000 + randomInt(2001); // zufällig 3,000–5,000 s
    const counts = tally(picks, k), lead = leaders(counts);
    const winner = lead.length === 1 ? lead[0] : -1;

    // Pop-Over vorbereiten
    setFace('F', 0, nm[0]); setFace('B', 1, nm[1]);
    const live = $('#live'); live.innerHTML = '';
    live.className = 'live' + (k > 3 ? ' many' : '');
    live.style.gridTemplateColumns = `repeat(${k > 3 ? 3 : k}, 1fr)`;
    const liveNums = nm.map((name, i) => {
      const c = document.createElement('div'); c.className = 'live-cell';
      const b = document.createElement('b'); b.textContent = '0'; b.style.color = col(i);
      const s = document.createElement('span'); s.textContent = name;
      c.append(b, s); live.appendChild(c); return b;
    });
    $('#progBar').style.width = '0%'; $('#progTxt').textContent = `Wurf 0 von ${n}`;
    $('#throwTitle').textContent = 'Die Münze fliegt …';
    coin.style.transform = ''; coin.classList.add('spinning');
    throwDlg.showModal();

    // Bei mehr als zwei Optionen wechseln die Münzseiten im Flug
    let faceTimer = null;
    if (k > 2) faceTimer = setInterval(() => {
      const f = randomInt(k), b = randomInt(k);
      setFace('F', f, nm[f]); setFace('B', b, nm[b]);
    }, 220);

    // Würfe live mitzählen
    const start = performance.now(), run = Array(k).fill(0);
    let shown = 0, raf;
    const tick = now => {
      const target = Math.min(n, Math.floor(((now - start) / delay) * n));
      while (shown < target) run[picks[shown++]]++;
      run.forEach((v, i) => liveNums[i].textContent = v);
      $('#progBar').style.width = (shown / n * 100) + '%';
      $('#progTxt').textContent = `Wurf ${shown} von ${n}`;
      if (shown < n) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    await sleep(delay);
    cancelAnimationFrame(raf); tick(start + delay);
    clearInterval(faceTimer);

    // Landen – auf der Gewinnerseite
    $('#throwTitle').textContent = winner >= 0 ? 'Gelandet!' : 'Gleichstand!';
    coin.classList.remove('spinning');
    if (k === 2 && winner === 1) {
      coin.style.transform = 'rotateX(1980deg)';
    } else {
      if (winner >= 0) setFace('F', winner, nm[winner]);
      else setFace('F', -1, lead.map(i => nm[i]).join(' = '));
      coin.style.transform = 'rotateX(1800deg)';
    }
    await sleep(800);
    throwDlg.close();

    const entry = { ts: Date.now(), opts: nm, n, counts, t: picks.join('') };
    const hist = LS.get('mw.history', []); hist.unshift(entry); LS.set('mw.history', hist.slice(0, HIST_MAX));
    renderHistory();
    showResult(entry, true);
    if (navigator.vibrate) navigator.vibrate(winner >= 0 ? [40, 60, 90] : [60, 60, 60]);
    busy = false;
  }

  /* ---------- Ergebnis-Pop-Over ---------- */
  function showResult(raw, celebrate) {
    const e = normEntry(raw), k = e.opts.length;
    const lead = leaders(e.counts), winner = lead.length === 1 ? lead[0] : -1;
    const pct = v => Math.round(v / e.n * 100);
    const score = e.counts.join(' : ');

    $('#resLabel').textContent = winner >= 0 ? 'Die Münze sagt' : 'Unentschieden';
    const win = $('#resWin');
    win.textContent = winner >= 0 ? e.opts[winner] : lead.map(i => e.opts[i]).join(' = ');
    win.style.color = winner >= 0 ? col(winner) : 'var(--text)';
    const wurf = e.n === 1 ? 'Wurf' : 'Würfen';
    $('#resSub').textContent = winner >= 0
      ? (k === 2 ? `${Math.max(...e.counts)} : ${Math.min(...e.counts)} bei ${e.n} ${wurf}` : `${e.counts[winner]} von ${e.n} ${wurf} · ${score}`)
      : `${score} – einfach nochmal werfen`;

    // Balken
    const bars = $('#bars'); bars.innerHTML = '';
    const fills = e.opts.map((name, i) => {
      const r = document.createElement('div'); r.className = 'bar-row';
      const nmEl = document.createElement('span'); nmEl.className = 'name'; nmEl.textContent = `${LETTERS[i]} · ${name}`;
      const num = document.createElement('span'); num.className = 'num'; num.textContent = `${e.counts[i]} (${pct(e.counts[i])} %)`;
      const bar = document.createElement('div'); bar.className = 'bar';
      const fill = document.createElement('div'); fill.style.background = col(i);
      bar.appendChild(fill); r.append(nmEl, num, bar); bars.appendChild(r);
      return fill;
    });

    // Einzelne Würfe
    const box = $('#throws'); box.innerHTML = '';
    const frag = document.createDocumentFragment();
    [...e.t].forEach((ch, i) => {
      const p = +ch, d = document.createElement('div');
      d.className = 't'; d.style.background = col(p);
      d.style.animationDelay = Math.min(i * 0.025, 1.2) + 's';
      d.title = `Wurf ${i + 1}: ${e.opts[p]}`;
      d.innerHTML = `<small>${i + 1}</small>${LETTERS[p]}`;
      frag.appendChild(d);
    });
    box.appendChild(frag);

    resDlg.showModal();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fills.forEach((f, i) => f.style.width = pct(e.counts[i]) + '%');
    }));
    if (celebrate && winner >= 0) confetti(winner);
  }

  function confetti(winner, box = '#confetti') {
    const c = $(box); c.innerHTML = '';
    const cs = getComputedStyle(document.documentElement);
    const colors = [cs.getPropertyValue('--c' + (winner % 6)), '#fde68a', '#f59e0b', '#ffffff'];
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('i');
      const ang = (i / 28) * Math.PI * 2, dist = 90 + randomInt(90);
      p.style.setProperty('--x', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--y', Math.sin(ang) * dist * 0.8 + 'px');
      p.style.setProperty('--r', (randomInt(720) - 360) + 'deg');
      p.style.background = colors[i % colors.length];
      c.appendChild(p);
    }
  }

  $('#goBtn').addEventListener('click', doThrow);
  $('#againBtn').addEventListener('click', doThrow);
  $('#closeBtn').addEventListener('click', () => resDlg.close());
  resDlg.addEventListener('click', e => { if (e.target === resDlg) resDlg.close(); });

  /* ---------- Verlauf ---------- */
  function renderHistory() {
    const list = $('#histList'), hist = LS.get('mw.history', []).map(normEntry);
    list.innerHTML = '';
    $('#clearBtn').style.display = hist.length ? '' : 'none';
    if (!hist.length) {
      const d = document.createElement('div'); d.className = 'empty';
      d.textContent = 'Noch keine Würfe – los geht’s!'; list.appendChild(d); return;
    }
    hist.forEach(e => {
      const lead = leaders(e.counts), winner = lead.length === 1 ? lead[0] : -1;
      const b = document.createElement('button'); b.className = 'hist-item';
      const w = document.createElement('div'); w.className = 'hist-win';
      w.textContent = winner >= 0 ? '🏆 ' + e.opts[winner] : '🤝 Unentschieden';
      if (winner >= 0) w.style.color = col(winner);
      const sc = document.createElement('div'); sc.className = 'hist-score'; sc.textContent = e.counts.join(' : ');
      const bar = document.createElement('div'); bar.className = 'minibar';
      e.counts.forEach((c, i) => {
        const s = document.createElement('span'); s.style.width = (c / e.n * 100) + '%'; s.style.background = col(i);
        bar.appendChild(s);
      });
      const m = document.createElement('div'); m.className = 'hist-meta';
      const dt = new Date(e.ts).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
      m.textContent = `${dt} · ${e.opts.join(' vs. ')} · ${e.n} ${e.n === 1 ? 'Wurf' : 'Würfe'}`;
      b.append(w, sc, bar, m);
      b.addEventListener('click', () => showResult(e, false));
      list.appendChild(b);
    });
  }
  $('#clearBtn').addEventListener('click', () => {
    if (confirm('Alle gespeicherten Ergebnisse löschen?')) { LS.set('mw.history', []); renderHistory(); }
  });
  renderHistory();

  /* =====================================================================
     Weitere Entscheidungshelfer: Würfel, Glücksrad, Wer zahlt?, Teams
     ===================================================================== */

  /* ---------- Navigation (#wuerfel, #rad, #zahlt, #teams) ---------- */
  const TOOLS = { wuerfel: '🎲 Würfel', rad: '🎡 Glücksrad', zahlt: '💸 Wer zahlt?', teams: '👥 Team-Auslosung' };
  const toolDlg = $('#toolDlg'), backBtn = $('#backBtn');
  let view = 'coin', fromHome = false;

  function route() {
    const h = location.hash.slice(1);
    view = TOOLS[h] ? h : 'coin';
    document.querySelectorAll('.view').forEach(m => m.hidden = m.id !== 'view-' + view);
    backBtn.hidden = view === 'coin';
    $('#brandIcon').hidden = view !== 'coin';
    $('#brandTitle').textContent = view === 'coin' ? 'Münzwurf' : TOOLS[view];
    document.title = view === 'coin' ? 'Münzwurf' : TOOLS[view].replace(/^\S+ /, '') + ' · Münzwurf';
    if (view === 'coin') fromHome = false;
    if (resDlg.open) resDlg.close();
    if (toolDlg.open) toolDlg.close();
    if (view === 'rad') drawWheel();
    scrollTo(0, 0);
  }
  document.querySelectorAll('.tool').forEach(a => a.addEventListener('click', () => { fromHome = true; }));
  backBtn.addEventListener('click', e => {
    e.preventDefault();
    if (fromHome) history.back();
    else { history.pushState(null, '', location.pathname + location.search); route(); }
  });
  addEventListener('hashchange', route);

  /* ---------- Ergebnis-Pop-Over der Werkzeuge ---------- */
  let toolAgain = null, toolExtra = null;
  function showToolResult({ emoji, label, win, color, sub, again, extra }) {
    $('#tdEmoji').textContent = emoji;
    $('#tdLabel').textContent = label;
    $('#tdWin').textContent = win; $('#tdWin').style.color = col(color);
    $('#tdSub').textContent = sub;
    toolAgain = again; toolExtra = extra ? extra.fn : null;
    $('#tdExtra').hidden = !extra; if (extra) $('#tdExtra').textContent = extra.text;
    toolDlg.showModal();
    confetti(color, '#toolConfetti');
    if (navigator.vibrate) navigator.vibrate([40, 60, 90]);
  }
  $('#tdClose').addEventListener('click', () => toolDlg.close());
  $('#tdAgain').addEventListener('click', () => { toolDlg.close(); toolAgain?.(); });
  $('#tdExtra').addEventListener('click', () => { toolDlg.close(); toolExtra?.(); });
  toolDlg.addEventListener('click', e => { if (e.target === toolDlg) toolDlg.close(); });

  /* ---------- Bearbeitbare Namensliste (Glücksrad, Wer zahlt?) ---------- */
  function makeList(el, addBtn, store, def, { min, max, ph, change }) {
    const items = LS.get(store, def).slice(0, max);
    while (items.length < min) items.push('');
    const persist = () => LS.set(store, items.map(s => (s || '').trim()));
    const api = {
      rows: [],
      names: () => items.map((s, i) => (s || '').trim() || ph(i)),
      render(focusIdx, silent) {
        el.innerHTML = '';
        api.rows = items.map((v, i) => {
          const row = document.createElement('div'); row.className = 'opt-row';
          const l = document.createElement('div'); l.className = 'letter num'; l.textContent = i + 1; l.style.background = col(i);
          const inp = document.createElement('input');
          inp.type = 'text'; inp.maxLength = 40; inp.autocomplete = 'off'; inp.placeholder = ph(i); inp.value = v;
          inp.style.borderColor = `color-mix(in srgb, ${col(i)} 55%, var(--line))`;
          inp.setAttribute('aria-label', ph(i));
          inp.addEventListener('input', () => { items[i] = inp.value; persist(); change?.(); });
          inp.addEventListener('focus', () => inp.select());
          const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '✕';
          rm.setAttribute('aria-label', ph(i) + ' entfernen');
          rm.disabled = items.length <= min;
          rm.addEventListener('click', () => api.remove(i));
          row.append(l, inp, rm); el.appendChild(row);
          if (focusIdx === i) setTimeout(() => inp.focus(), 0);
          return row;
        });
        addBtn.disabled = items.length >= max;
        if (!silent) change?.();
      },
      remove(i) { if (items.length <= min) return; items.splice(i, 1); api.render(); persist(); },
      lock(on) { el.inert = on; addBtn.inert = on; }
    };
    addBtn.addEventListener('click', () => {
      if (items.length >= max) return;
      items.push(''); api.render(items.length - 1); persist();
    });
    api.render(-1, true);
    return api;
  }

  function chips(el, values, label, active, onPick) {
    el.innerHTML = '';
    values.forEach(v => {
      const b = document.createElement('button'); b.className = 'chip' + (v === active ? ' active' : '');
      b.textContent = label(v);
      b.addEventListener('click', () => {
        el.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        b.classList.add('active'); onPick(v);
      });
      el.appendChild(b);
    });
  }

  /* ---------- 🎲 Würfel ---------- */
  const SIDES = [4, 6, 8, 10, 12, 20], DICE_HIST = 10;
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const dice = Object.assign({ n: 2, s: 6, hist: [] }, LS.get('mw.dice', {}));
  const saveDice = () => LS.set('mw.dice', dice);
  let diceBusy = false;

  function drawDie(el, v, s, i) {
    el.innerHTML = ''; el.className = 'die';
    el.style.borderColor = `color-mix(in srgb, ${col(i)} 70%, var(--line))`;
    if (s === 6 && v) {
      el.classList.add('pips');
      for (let p = 0; p < 9; p++) {
        const dot = document.createElement('i');
        if (PIPS[v].includes(p)) { dot.className = 'on'; dot.style.background = col(i); }
        el.appendChild(dot);
      }
    } else {
      el.append(v || '?');
      const t = document.createElement('small'); t.textContent = 'W' + s; el.appendChild(t);
    }
  }
  function diceStage(values) {
    const st = $('#diceStage'); st.innerHTML = '';
    return Array.from({ length: dice.n }, (_, i) => {
      const d = document.createElement('div'); drawDie(d, values?.[i], dice.s, i); st.appendChild(d); return d;
    });
  }
  function diceSum(values) {
    const box = $('#diceSum'); box.innerHTML = '';
    if (!values) return;
    const b = document.createElement('b'), sp = document.createElement('span');
    b.textContent = values.reduce((a, v) => a + v, 0);
    sp.textContent = values.length > 1 ? `Summe · ${values.join(' + ')}` : `W${dice.s}`;
    box.append(b, sp);
  }
  function renderDiceHist() {
    const list = $('#diceHist'); list.innerHTML = '';
    $('#diceClear').style.display = dice.hist.length ? '' : 'none';
    if (!dice.hist.length) {
      const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Noch nicht gewürfelt.'; list.appendChild(d); return;
    }
    dice.hist.forEach(h => {
      const r = document.createElement('div'); r.className = 'mini-item';
      const a = document.createElement('span'); a.textContent = `${h.v.length}× W${h.s} · ${h.v.join(' + ')}`;
      const b = document.createElement('b'); b.textContent = h.v.reduce((x, y) => x + y, 0);
      r.append(a, b); list.appendChild(r);
    });
  }
  async function rollDice() {
    if (diceBusy) return; diceBusy = true;
    const n = dice.n, s = dice.s;
    const values = Array.from({ length: n }, () => randomInt(s) + 1);
    const els = diceStage(); diceSum(null);
    els.forEach(d => d.classList.add('rolling'));
    const timer = setInterval(() => els.forEach((d, i) => { drawDie(d, randomInt(s) + 1, s, i); d.classList.add('rolling'); }), 80);
    await sleep(900 + randomInt(701));
    clearInterval(timer);
    els.forEach((d, i) => { drawDie(d, values[i], s, i); d.classList.add('landed'); });
    diceSum(values);
    dice.hist.unshift({ s, v: values }); dice.hist = dice.hist.slice(0, DICE_HIST); saveDice();
    renderDiceHist();
    if (navigator.vibrate) navigator.vibrate(40);
    diceBusy = false;
  }
  function diceSetup() {
    if (diceBusy) return;
    saveDice(); diceStage(); diceSum(null);
  }
  chips($('#diceCount'), [1, 2, 3, 4, 5, 6], v => v, dice.n, v => { dice.n = v; diceSetup(); });
  chips($('#diceSides'), SIDES, v => 'W' + v, dice.s, v => { dice.s = v; diceSetup(); });
  $('#diceGo').addEventListener('click', rollDice);
  $('#diceStage').addEventListener('click', rollDice);
  $('#diceClear').addEventListener('click', () => { dice.hist = []; saveDice(); renderDiceHist(); });
  diceStage(); renderDiceHist();

  /* ---------- 🎡 Glücksrad ---------- */
  const SVG = 'http://www.w3.org/2000/svg', wheel = $('#wheel');
  const wheelList = makeList($('#wheelList'), $('#wheelAdd'), 'mw.wheel', ['Pizza', 'Sushi', 'Döner', 'Pasta'],
    { min: 2, max: 12, ph: i => 'Feld ' + (i + 1), change: () => drawWheel() });
  let wheelRot = 0, wheelBusy = false;

  // Nachbarfelder nie gleichfarbig (auch nicht letztes neben erstem)
  const segColor = (i, n) => (i === n - 1 && n > 1 && i % 6 === 0) ? 1 : i % 6;
  const polar = (deg, r) => { const a = deg * Math.PI / 180; return [Math.sin(a) * r, -Math.cos(a) * r]; };

  function drawWheel() {
    const nm = wheelList.names(), n = nm.length, seg = 360 / n, R = 96;
    wheel.innerHTML = '';
    nm.forEach((name, i) => {
      const [x0, y0] = polar(i * seg, R), [x1, y1] = polar((i + 1) * seg, R);
      const p = document.createElementNS(SVG, 'path');
      p.setAttribute('d', `M0,0 L${x0},${y0} A${R},${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1},${y1} Z`);
      p.style.fill = col(segColor(i, n)); p.style.stroke = 'var(--card)'; p.style.strokeWidth = '1.5';
      const t = document.createElementNS(SVG, 'text');
      t.setAttribute('transform', `rotate(${(i + 0.5) * seg - 90})`);
      t.setAttribute('x', 86); t.setAttribute('text-anchor', 'end');
      t.style.fontSize = (n <= 4 ? 13 : n <= 8 ? 11 : 9) + 'px';
      t.textContent = name.length > 13 ? name.slice(0, 12) + '…' : name;
      wheel.append(p, t);
    });
    const ring = document.createElementNS(SVG, 'circle');
    ring.setAttribute('r', 97); ring.style.fill = 'none'; ring.style.stroke = 'var(--card)'; ring.style.strokeWidth = '3';
    wheel.appendChild(ring);
  }

  async function spinWheel() {
    if (wheelBusy) return; wheelBusy = true;
    const nm = wheelList.names(), n = nm.length, seg = 360 / n;
    const win = randomInt(n);
    const target = (win + (100 + randomInt(801)) / 1000) * seg; // irgendwo im Gewinnerfeld, nicht auf der Kante
    const dur = 4000 + randomInt(1501);
    wheelRot += 360 * (5 + randomInt(3)) + ((((-target - wheelRot) % 360) + 360) % 360);
    wheelList.lock(true);
    wheel.style.transition = `transform ${dur}ms cubic-bezier(.12,.7,.15,1)`;
    wheel.style.transform = `rotate(${wheelRot}deg)`;
    await sleep(dur + 250);
    wheelList.lock(false); wheelBusy = false;
    if (view !== 'rad') return;
    showToolResult({
      emoji: '🎡', label: 'Das Rad sagt', win: nm[win], color: segColor(win, n),
      sub: `Feld ${win + 1} von ${n}`, again: spinWheel,
      extra: n > 2 ? { text: `„${nm[win]}“ aus dem Rad entfernen`, fn: () => wheelList.remove(win) } : null
    });
  }
  $('#wheelGo').addEventListener('click', spinWheel);
  $('#wheelHub').addEventListener('click', spinWheel);

  /* ---------- 💸 Wer zahlt? ---------- */
  const payList = makeList($('#payList'), $('#payAdd'), 'mw.pay', ['', '', ''],
    { min: 2, max: 12, ph: i => 'Person ' + (i + 1) });
  let payBusy = false;
  const payHot = idx => payList.rows.forEach((r, i) => r.classList.toggle('hot', i === idx));

  async function whoPays() {
    if (payBusy) return; payBusy = true;
    const nm = payList.names(), n = nm.length, loser = randomInt(n);
    // Markierung springt zufällig durch die Liste, wird langsamer und bleibt beim Verlierer stehen
    const steps = 18 + randomInt(9), seq = [];
    let prev = -1;
    for (let k = 0; k < steps - 1; k++) {
      let j; do { j = randomInt(n); } while (j === prev || (k === steps - 2 && j === loser));
      seq.push(prev = j);
    }
    seq.push(loser);
    payList.lock(true);
    for (let k = 0; k < seq.length; k++) {
      payHot(seq[k]);
      if (navigator.vibrate) navigator.vibrate(8);
      await sleep(55 + Math.pow(k / seq.length, 2.2) * 420);
    }
    await sleep(500);
    payList.lock(false); payBusy = false;
    if (view !== 'zahlt') return;
    showToolResult({
      emoji: '💸', label: 'Heute zahlt', win: nm[loser], color: loser,
      sub: `Ausgelost unter ${n} Personen`, again: whoPays
    });
  }
  $('#payGo').addEventListener('click', whoPays);
  toolDlg.addEventListener('close', () => { if (!payBusy) payHot(-1); });

  /* ---------- 👥 Team-Auslosung ---------- */
  const teams = Object.assign({ names: '', k: 2, last: null }, LS.get('mw.teams', {}));
  const saveTeams = () => LS.set('mw.teams', teams);
  const teamNames = $('#teamNames');
  let teamBusy = false;
  const parseNames = () => teamNames.value.split(/[\n,;]+/).map(s => s.trim().slice(0, 40)).filter(Boolean).slice(0, 200);

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = randomInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const split = (names, k) => { const t = Array.from({ length: k }, () => []); names.forEach((x, i) => t[i % k].push(x)); return t; };

  function teamHint() {
    const n = parseNames().length, k = teams.k;
    $('#teamCnt').textContent = n ? `(${n})` : '';
    const base = Math.floor(n / k), extra = n % k, p = c => c === 1 ? 'Person' : 'Personen';
    $('#teamHint').textContent =
      n < k ? `Für ${k} Teams werden mindestens ${k} Namen gebraucht.`
      : extra ? `${k} Teams mit ${base}–${base + 1} Personen` : `${k} Teams mit je ${base} ${p(base)}`;
  }
  function renderTeams(list) {
    const out = $('#teamOut'); out.innerHTML = '';
    $('#teamActions').hidden = !list;
    if (!list) return;
    list.forEach((members, i) => {
      const c = document.createElement('div'); c.className = 'team';
      const h = document.createElement('h3'); h.textContent = `Team ${i + 1} · ${members.length}`; h.style.background = col(i);
      const ol = document.createElement('ol');
      members.forEach(m => { const li = document.createElement('li'); li.textContent = m; ol.appendChild(li); });
      c.append(h, ol); out.appendChild(c);
    });
  }
  async function drawTeams() {
    if (teamBusy) return;
    const names = parseNames(), k = teams.k;
    if (names.length < k) { teamHint(); teamNames.focus(); return; }
    teamBusy = true; teamNames.inert = true;
    for (let f = 0; f < 10; f++) { renderTeams(split(shuffle(names), k)); await sleep(90); }
    teams.last = split(shuffle(names), k); saveTeams();
    renderTeams(teams.last);
    $('#teamOut').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    if (navigator.vibrate) navigator.vibrate([40, 60, 90]);
    teamNames.inert = false; teamBusy = false;
  }
  teamNames.value = teams.names;
  teamNames.addEventListener('input', () => { teams.names = teamNames.value; saveTeams(); teamHint(); });
  chips($('#teamCount'), [2, 3, 4, 5, 6], v => v, teams.k, v => { teams.k = v; saveTeams(); teamHint(); });
  $('#teamGo').addEventListener('click', drawTeams);
  $('#teamCopy').addEventListener('click', async () => {
    if (!teams.last) return;
    const txt = teams.last.map((m, i) => `Team ${i + 1}: ${m.join(', ')}`).join('\n');
    const b = $('#teamCopy');
    try { await navigator.clipboard.writeText(txt); b.textContent = '✓ Kopiert'; }
    catch (e) { b.textContent = 'Kopieren nicht möglich'; }
    setTimeout(() => { b.textContent = '📋 Kopieren'; }, 1600);
  });
  teamHint(); renderTeams(teams.last);

  route();

  /* ---------- Offline / installierbar ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
